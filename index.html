<!doctype html>
<html lang="en" class="dark">

    <meta charset="UTF-8" />

    <meta name="robots" content="index, follow" />

    <!-- Prevent theme flicker by applying theme from cookie / localStorage early -->
    <script>
      (function () {
        try {
          var match = document.cookie.match(/(?:^|;\s*)theme=([^;]*)/);
          var theme = match ? decodeURIComponent(match[1]) : localStorage.getItem('theme');
          if (theme === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
